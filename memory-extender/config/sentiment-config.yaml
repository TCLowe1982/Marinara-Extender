# Sentiment Analysis Pipeline — Tunable Configuration
# Edit this file to adjust thresholds and weights without restarting the server.
# All changes take effect on the next pipeline call.

# ── Chunking (Stage 0) ───────────────────────────────────────────────────────
# Controls how raw dialogue turns are merged into coherent chunks before
# classification. Merging uses cosine similarity between embeddings.
chunking:
  # Similarity threshold for merging consecutive same-speaker turns.
  # 1.0 = never merge, 0.0 = always merge. 0.72 catches same topic/thread.
  merge_threshold: 0.72
  # Maximum number of original turns that can be merged into one chunk.
  # Prevents runaway merging of very long monologues.
  max_turns_per_chunk: 6
  # If the Marinara sidecar is unavailable, fall back to grouping by speaker
  # turn only (no semantic merging). true = silent fallback, false = error.
  fallback_on_sidecar_unavailable: true

# ── Salience thresholds ───────────────────────────────────────────────────────
# Chunks with a salience score below the active threshold are skipped entirely.
# Stage 1 routing: all chunks are scored regardless.
# Stage 2 deep analysis (Gemma call): only chunks that pass the threshold.
#
# chat: direct conversational language; single keyword hit is often sufficient.
# story: literary prose signals emotions obliquely — physical sensation, gesture,
#   subtext. Lower threshold catches beats that keyword scoring underweights.
salience_threshold: 0.40
story_salience_threshold: 0.25

# ── Content floor (s8qe) ──────────────────────────────────────────────────────
# Minimum raw word tokens a chunk must contain before it is eligible to become a
# beat at all. Below this the chunk is not scored and not analyzed — no beat,
# rather than an invented one.
#
# WHY A FLOOR EXISTS. The salience gate is emotion-keyed, not content-keyed: the
# bare token "open" matches a vulnerability keyword and sails through it. Asked
# to name what happened in a moment that contains nothing, an 8B model reaches
# for the nearest concrete sentence it has been shown — which is the prompt's own
# example. That is the whole echo mechanism (pifl), and the floor removes its
# precondition rather than blocklisting its output.
#
# WHY 2, AND WHY RAW TOKENS. Measured over 8,841 beats
# (`node scripts/chunk-floor-scan.mjs`):
#
#   raw tokens      n     echo%    distinct-motivation%
#   1             513    89.1%       15.6%     <- the entire pathology
#   2-3             5    20.0%      100.0%
#   3+           8323     ~5%        ~95%
#
# The cliff is at ONE token and nowhere else. Two rejected alternatives, both
# measured before being discarded:
#   - CHARACTERS. The prior sweep's 0-500 bucket implied a ~500-char floor; that
#     bucket turned out to be one spike at 0-10 chars. A 500 floor would have
#     discarded 2,099 unique real beats to catch 93 further echoes.
#   - CONTENT WORDS (skeleton tokens). Looks equivalent, and is wrong at exactly
#     the sizes that matter: for a short utterance the function words ARE the
#     content. "I love you," has one content word, same as the junk token
#     "open" — but three raw tokens against one. Beats it would have silently
#     discarded include "I love you," at salience 1.0, "All of me," and
#     "You are a LIAR,".
min_chunk_tokens: 2

# ── Per-emotion weights ───────────────────────────────────────────────────────
# Scales the raw keyword match score for each emotion category.
# Higher = more sensitive. Dysregulation and vulnerability are intentionally
# weighted high because they appear in subtler language.
emotion_weights:
  fear:          0.80
  shame:         0.85
  hope:          0.60
  desire:        0.65
  relief:        0.55
  vulnerability: 0.90
  trust:         0.60
  anger:         0.75
  joy:           0.50
  dysregulation: 0.90

# ── Keyword match scoring ─────────────────────────────────────────────────────
# Each keyword match contributes this much to the category score (capped at 1.0).
# Matches compound: 2 matches = 2 × match_score_per_hit, etc.
match_score_per_hit: 0.55

# ── Compound amplification ────────────────────────────────────────────────────
# When a chunk has multiple keyword matches across ALL emotion categories,
# all scores get boosted. Mirrors the AutoTroll compound toxicity pattern.
compound_boost:
  two_matches:      1.30
  three_plus:       1.50

# ── Short-message boost ───────────────────────────────────────────────────────
# Very short emotionally-charged messages tend to be more intense.
short_message:
  word_count_threshold: 10
  multiplier:           1.20

# ── Dysregulation contextual rule ────────────────────────────────────────────
# Deflection words alone are weak signals (fear of committing to a score).
# When a chunk also contains attachment/boundary words, the combination is
# a strong dysregulation indicator — boost the dysregulation score.
dysregulation_contextual:
  combined_boost: 1.50

# ── Structural patterns ───────────────────────────────────────────────────────
# Syntactic/format-based signals that keyword lists cannot catch.
# pattern: a regex string (applied case-insensitively to the chunk text)
# score: contribution to the emotion score when matched (0.0–1.0)
structural_patterns:
  dissociation_grounding:
    pattern: '"[a-z]{1,8}\."'
    # No flags — case-sensitive. [a-z] intentionally matches only lowercase.
    # "ok." is dissociative; "OK." is assertive.
    emotion: dysregulation
    subpattern: dissociation
    score: 0.75
    description: >
      Single quoted lowercase word with period — minimal grounding response
      under dissociation (e.g. "ok.", "stay.", "here.", "safe.").

  ellipsis_shutdown:
    pattern: '\.{3,}'
    # No flags — dots are dots, case is irrelevant.
    emotion: dysregulation
    subpattern: shutdown
    score: 0.45
    description: >
      Three or more ellipsis dots — trailing off, inability to complete
      thought, emotional shutdown or dissociation.

  all_caps_burst:
    pattern: '\b[A-Z]{4,}\b'
    # No flags — MUST be case-sensitive. With "i" flag this would match
    # every word of 4+ letters, defeating the purpose.
    emotion: anger
    score: 0.50
    description: >
      All-caps word of 4+ letters — emotional flooding, shouting.

  self_erasure:
    pattern: '\bi (don''t|shouldn''t|can''t|won''t) (exist|matter|deserve|be here)\b'
    flags: 'i'
    # Case-insensitive — must match both "i don't..." and "I don't...".
    emotion: shame
    subpattern: shutdown
    score: 0.80
    description: >
      Self-erasure phrasing — deep shame or dissociative self-negation.
